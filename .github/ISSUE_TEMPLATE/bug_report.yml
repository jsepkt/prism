name: "🐛 Bug Report"
description: "File a bug report to help improve Prism Network"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: version
    attributes:
      label: Prism Node Version / Commit
      placeholder: "e.g. 0.1.0 (commit 909b703)"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Core Ledger / State Engine"
        - "Consensus (PoAC)"
        - "Zero-Knowledge / Attestation"
        - "P2P Gossip Network"
        - "RPC API / Node Binary"
        - "Web Dashboard / Wallet"
        - "TypeScript SDK"
        - "Mobile App"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      placeholder: "Provide a clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run '...'
        2. Call endpoint '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      render: shell
