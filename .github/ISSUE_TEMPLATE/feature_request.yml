name: "✨ Feature Request"
description: "Suggest an idea or improvement for Prism Network"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Prism better? We'd love to hear it!
  - type: input
    id: title
    attributes:
      label: Feature Summary
      placeholder: "e.g. Add Solana cross-chain intent bridge"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: "Is your feature request related to a problem? Please describe."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: "Describe the solution you'd like to see implemented."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      placeholder: "Describe any alternative solutions or features you've considered."
