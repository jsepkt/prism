[workspace]
resolver = "2"
members = [
    "crates/prism-crypto",
    "crates/prism-core",
    "crates/prism-consensus",
    "crates/prism-client",
    "crates/prism-p2p",
    "crates/prism-agent",
    "crates/prism-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Prism Network Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Cryptography & Hashing
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

# Utilities & Async
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Internal crates
prism-crypto = { path = "crates/prism-crypto" }
prism-core = { path = "crates/prism-core" }
prism-consensus = { path = "crates/prism-consensus" }
prism-client = { path = "crates/prism-client" }
prism-p2p = { path = "crates/prism-p2p" }
prism-agent = { path = "crates/prism-agent" }
